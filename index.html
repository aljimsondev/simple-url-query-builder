<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      Simple URL Query Builder — Build & Copy Query String Parameters
    </title>
    <meta
      name="description"
      content="A free, zero-dependency browser tool for building URLs with query parameters. Add key-value pairs, preview the full URL in real time, and copy the full URL, relative path, or params only."
    />
    <meta
      name="keywords"
      content="url query builder, query string generator, query parameter tool, url encoder, query params, api url builder, url constructor, search params builder"
    />
    <meta name="author" content="aljimsondev" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://simple-url-query-builder.vercel.app" />

    <!-- Open Graph (Facebook, LinkedIn, Slack previews) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="URL Query Builder — Build & Copy Query String Parameters"
    />
    <meta
      property="og:description"
      content="Add key-value pairs to any URL, preview it live with color-coded output, and copy the full URL, relative path, or params only. No dependencies, no install."
    />
    <meta
      property="og:url"
      content="https://simple-url-query-builder.vercel.app"
    />
    <meta property="og:site_name" content="URL Query Builder" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Simple URL Query Builder — Build & Copy Query String Parameters"
    />
    <meta
      name="twitter:description"
      content="Add key-value pairs to any URL, preview it live with color-coded output, and copy the full URL, relative path, or params only. No dependencies, no install."
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Simple URL Query Builder",
        "description": "A free browser tool for building URLs with query string parameters. Add key-value pairs, preview the full URL in real time, and copy the full URL, relative path, or params only.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Real-time URL generation",
          "Key-value query param editor",
          "Copy full URL, relative path, or params only",
          "encodeURIComponent encoding",
          "Dark mode support",
          "Zero dependencies"
        ]
      }
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #ffffff;
        --bg-secondary: #f5f5f4;
        --bg-tertiary: #f0efeb;
        --bg-danger: #fff0f0;
        --bg-success: #f0faf4;
        --border: rgba(0, 0, 0, 0.12);
        --border-hover: rgba(0, 0, 0, 0.25);
        --border-danger: rgba(200, 50, 50, 0.35);
        --border-success: rgba(30, 140, 70, 0.35);
        --text: #1a1a18;
        --text-secondary: #6b6b67;
        --text-tertiary: #a0a09a;
        --text-info: #185fa5;
        --text-warning: #854f0b;
        --text-success: #1a6e3a;
        --text-danger: #a32d2d;
        --radius-md: 8px;
        --radius-lg: 12px;
        --font-sans: system-ui, -apple-system, sans-serif;
        --font-mono: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1a;
          --bg-secondary: #252523;
          --bg-tertiary: #2a2a28;
          --bg-danger: #2a1a1a;
          --bg-success: #152318;
          --border: rgba(255, 255, 255, 0.12);
          --border-hover: rgba(255, 255, 255, 0.25);
          --border-danger: rgba(220, 80, 80, 0.35);
          --border-success: rgba(60, 180, 100, 0.35);
          --text: #e8e8e2;
          --text-secondary: #9a9a94;
          --text-tertiary: #606060;
          --text-info: #85b7eb;
          --text-warning: #ef9f27;
          --text-success: #5dca85;
          --text-danger: #f09595;
        }
      }

      body {
        font-family: var(--font-sans);
        color: var(--text);
        background: var(--bg-tertiary);
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .container {
        width: 100%;
        max-width: 640px;
      }

      h1 {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 1.5rem;
        text-align: center;
        gap: 8px;
        color: var(--text);
      }

      h1 svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      .section {
        background: var(--bg);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.25rem;
        margin-bottom: 1rem;
      }

      .section-title {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-title svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .badge {
        font-size: 11px;
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-md);
        padding: 2px 8px;
        color: var(--text-secondary);
        font-weight: 400;
      }

      label {
        font-size: 13px;
        color: var(--text-secondary);
        display: block;
        margin-bottom: 6px;
      }

      input[type='text'] {
        width: 100%;
        height: 36px;
        padding: 0 10px;
        font-size: 14px;
        font-family: var(--font-sans);
        color: var(--text);
        background: var(--bg);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-md);
        outline: none;
        transition: border-color 0.15s;
      }

      input[type='text']:hover {
        border-color: var(--border-hover);
      }
      input[type='text']:focus {
        border-color: var(--border-hover);
        box-shadow: 0 0 0 3px rgba(100, 100, 255, 0.1);
      }

      .param-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      .param-row input {
        flex: 1;
        min-width: 0;
      }

      .sep {
        font-size: 13px;
        color: var(--text-secondary);
        flex-shrink: 0;
      }

      .rm-btn {
        background: none;
        border: 0.5px solid var(--border-hover);
        border-radius: var(--radius-md);
        width: 32px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-secondary);
        flex-shrink: 0;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }

      .rm-btn:hover {
        background: var(--bg-danger);
        color: var(--text-danger);
        border-color: var(--border-danger);
      }

      .rm-btn svg {
        width: 15px;
        height: 15px;
      }

      .add-btn {
        background: none;
        border: 0.5px dashed var(--border-hover);
        border-radius: var(--radius-md);
        height: 36px;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-secondary);
        font-family: var(--font-sans);
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        justify-content: center;
        transition:
          background 0.15s,
          color 0.15s;
      }

      .add-btn:hover {
        background: var(--bg-secondary);
        color: var(--text);
      }
      .add-btn svg {
        width: 14px;
        height: 14px;
      }

      .result-box {
        background: var(--bg-secondary);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-md);
        padding: 1rem;
        font-family: var(--font-mono);
        font-size: 12px;
        word-break: break-all;
        line-height: 1.7;
        min-height: 52px;
      }

      .url-hint {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 6px;
      }

      .copy-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .copy-btn {
        background: none;
        border: 0.5px solid var(--border-hover);
        border-radius: var(--radius-md);
        padding: 0 14px;
        height: 34px;
        cursor: pointer;
        font-size: 13px;
        font-family: var(--font-sans);
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background 0.15s;
        position: relative;
      }

      .copy-btn:hover {
        background: var(--bg-secondary);
      }
      .copy-btn.success {
        color: var(--text-success);
        border-color: var(--border-success);
      }
      .copy-btn svg {
        width: 14px;
        height: 14px;
      }

      .badge-suggested {
        position: absolute;
        top: -9px;
        right: -8px;
        font-size: 10px;
        background: var(--bg-success);
        border: 0.5px solid var(--border-success);
        border-radius: var(--radius-md);
        padding: 1px 6px;
        color: var(--text-success);
        font-weight: 400;
        white-space: nowrap;
        pointer-events: none;
      }

      .empty-hint {
        font-size: 13px;
        color: var(--text-tertiary);
        margin-bottom: 12px;
      }

      .c-base {
        color: var(--text-info);
      }
      .c-key {
        color: var(--text-warning);
      }
      .c-val {
        color: var(--text-success);
      }
      .c-sep {
        color: var(--text-secondary);
      }
      .c-hint {
        color: var(--text-tertiary);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Simple URL Query Builder</h1>

      <div class="section">
        <div class="section-title">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
            />
            <path
              d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
            />
          </svg>
          Base URL
        </div>
        <label for="base-url">Enter your URL</label>
        <input
          type="text"
          id="base-url"
          placeholder="https://example.com/api/resource"
          oninput="liveUpdate()"
        />
      </div>

      <div class="section">
        <div class="section-title">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
          Query params
          <span class="badge" id="param-count">0 params</span>
        </div>
        <div id="params-list"></div>
        <button class="add-btn" onclick="addParam()">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Add param
        </button>
      </div>

      <div class="section">
        <div class="section-title">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
            />
          </svg>
          Generated URL
        </div>
        <div class="result-box" id="result-box">
          <span class="c-hint" style="font-family: var(--font-mono)"
            >Enter a URL above to get started…</span
          >
        </div>
        <div class="url-hint" id="url-hint"></div>
        <div class="copy-row">
          <button class="copy-btn" id="copy-full" onclick="copyUrl('full')">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" />
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              />
            </svg>
            Copy full URL
          </button>
          <button
            class="copy-btn"
            id="copy-relative"
            onclick="copyUrl('relative')"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
              />
              <path
                d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
              />
            </svg>
            Copy relative path
            <span class="badge-suggested">suggested</span>
          </button>
          <button class="copy-btn" id="copy-params" onclick="copyUrl('params')">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
            </svg>
            Copy params only
          </button>
        </div>
      </div>
    </div>

    <script>
      let params = [];
      let paramId = 0;
      let builtUrl = '';
      let builtRelative = '';
      let builtParams = '';

      function addParam(k = '', v = '') {
        const id = paramId++;
        params.push({ id, k, v });
        render();
        liveUpdate();
      }

      function removeParam(id) {
        params = params.filter((p) => p.id !== id);
        render();
        liveUpdate();
      }

      function syncParam(id, field, val) {
        const p = params.find((x) => x.id === id);
        if (p) p[field] = val;
        liveUpdate();
      }

      function esc(s) {
        return (s || '').replace(/"/g, '&quot;');
      }

      function enc(s) {
        return (s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function xIcon() {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
      }

      function render() {
        const list = document.getElementById('params-list');
        const count = document.getElementById('param-count');
        count.textContent = `${params.length} param${params.length !== 1 ? 's' : ''}`;

        if (params.length === 0) {
          list.innerHTML =
            '<p class="empty-hint">No params yet — add one below.</p>';
          return;
        }

        list.innerHTML = params
          .map(
            (p) => `
      <div class="param-row">
        <input type="text" placeholder="key" value="${esc(p.k)}" oninput="syncParam(${p.id},'k',this.value)">
        <span class="sep">=</span>
        <input type="text" placeholder="value" value="${esc(p.v)}" oninput="syncParam(${p.id},'v',this.value)">
        <button class="rm-btn" onclick="removeParam(${p.id})" aria-label="Remove param">${xIcon()}</button>
      </div>
    `,
          )
          .join('');
      }

      function liveUpdate() {
        const base = (document.getElementById('base-url').value || '').trim();

        if (!base) {
          builtUrl = '';
          builtRelative = '';
          builtParams = '';
          document.getElementById('result-box').innerHTML =
            '<span class="c-hint" style="font-family:monospace">Enter a URL above to get started…</span>';
          document.getElementById('url-hint').innerHTML = '';
          return;
        }

        const pairs = params.filter((p) => p.k.trim());
        const qs = pairs
          .map(
            (p) =>
              `${encodeURIComponent(p.k.trim())}=${encodeURIComponent(p.v)}`,
          )
          .join('&');
        const sep = base.includes('?') ? '&' : '?';
        const full = qs ? `${base}${sep}${qs}` : base;

        builtUrl = full;
        builtParams = qs ? `?${qs}` : '';

        try {
          const u = new URL(full);
          builtRelative = u.pathname + u.search + u.hash;
        } catch (e) {
          builtRelative = full;
        }

        const box = document.getElementById('result-box');
        const hint = document.getElementById('url-hint');

        if (pairs.length > 0) {
          const paramHtml = pairs
            .map(
              (p, i) =>
                `<span class="c-key">${enc(encodeURIComponent(p.k.trim()))}</span>` +
                `<span class="c-sep">=</span>` +
                `<span class="c-val">${enc(encodeURIComponent(p.v))}</span>` +
                (i < pairs.length - 1
                  ? '<span class="c-sep">&amp;</span>'
                  : ''),
            )
            .join('');
          box.innerHTML = `<span class="c-base">${enc(base)}${enc(sep)}</span>${paramHtml}`;
          hint.innerHTML = `<span class="c-hint">${pairs.length} param${pairs.length !== 1 ? 's' : ''} &nbsp;·&nbsp; <span class="c-base">base</span> &nbsp;<span class="c-key">key</span> &nbsp;<span class="c-val">value</span></span>`;
        } else {
          box.innerHTML = `<span class="c-base">${enc(full)}</span>`;
          hint.innerHTML = '';
        }
      }

      function copyUrl(type) {
        const text =
          type === 'full'
            ? builtUrl
            : type === 'relative'
              ? builtRelative
              : builtParams || '(no params)';
        if (!text) return;

        navigator.clipboard.writeText(text).then(() => {
          const id =
            type === 'full'
              ? 'copy-full'
              : type === 'relative'
                ? 'copy-relative'
                : 'copy-params';
          const btn = document.getElementById(id);
          const orig = btn.innerHTML;
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
          btn.classList.add('success');
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.classList.remove('success');
          }, 2000);
        });
      }

      render();
      liveUpdate();
    </script>
  </body>
</html>
